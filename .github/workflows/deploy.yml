name: Deploy to Cloudflare Pages

# Deploie a chaque push sur main.
# ATTENTION : GitHub ne declenche aucun workflow sur un push authentifie par
# GITHUB_TOKEN. Si un jour un bot pousse sur ce depot, il devra appeler
# wrangler lui-meme, ce workflow ne se reveillera pas pour lui.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest pages deploy . --project-name=visites360immobilier --branch=main
